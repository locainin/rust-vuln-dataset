target_base_head: 81dd398a2902a10c58c38d03e4e254bb1da184bf
integrity_inventory: checksums.sha256
transformations:
  mizan.json: Native checkout filtering only; retained records equal upstream values
  Cargo.toml: Native checkout dataset-only workspace, resolver 2; excludes framework/mutation tools
  Cargo.lock: 'Pruned from pinned upstream lock: 707 to 538 packages, 169 removed; no new package identity/version/source/checksum
    tuples'
  UPSTREAM-LICENSE.md: Byte-identical copy of upstream docs/src/license.md; renamed for attribution
  samples/: Byte-identical complete supplied projects, dependency trees, case-level files; no repairs
build_environment:
  date: '2026-09-15'
  image: rust@sha256:738ae99a3d75623f41e6882566b4ef37e38a9840244a47efd4a0ca22e9628b88
  rust: 1.84.1
  os: Debian Bookworm
  target: x86_64-unknown-linux-gnu
  profile: dev
  features: default
  command: cargo build --locked --offline --jobs 4 --manifest-path samples/{path_to_crate}/Cargo.toml
  network: disabled during builds; controlled cargo fetch setup
  isolation: non-root UID; cap-drop ALL; no-new-privileges; read-only rootfs and source bind; task-only Cargo registry
    and target volumes; tmpfs /tmp; no credentials/home/SSH-agent/Docker-socket mounts
  resource_limits:
    cpus: 4
    memory: 4g
    pids: 256
    timeout_seconds_per_variant: 240
  executed_sample_programs: false
